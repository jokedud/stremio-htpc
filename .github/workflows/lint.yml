name: lint
on: [push, pull_request]
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh uninstall.sh lib/*.sh
      - run: python3 -m unittest discover -s tests -v
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path windows -Recurse -Settings windows/PSScriptAnalyzerSettings.psd1
          $issues | Format-Table -AutoSize
          if ($issues) { exit 1 }
      - shell: powershell
        run: |
          Install-Module Pester -MinimumVersion 5.5 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -MinimumVersion 5.5
          $result = Invoke-Pester windows/tests -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { exit 1 }
      - shell: powershell
        run: |
          Invoke-WebRequest -UseBasicParsing https://www.autohotkey.com/download/2.0/AutoHotkey_2.0.32.zip -OutFile ahk.zip
          if ((Get-FileHash ahk.zip).Hash -ne '384A4C125E8D7B5B77DDBD5A593EC761D3E9E96E97A95931CF56E9A077FDA114') { exit 1 }
          Expand-Archive ahk.zip ahk
          $p = Start-Process ahk\AutoHotkey64.exe -ArgumentList '/ErrorStdOut', '/Validate', 'windows\kiosk.ahk' -Wait -PassThru -NoNewWindow
          exit $p.ExitCode
