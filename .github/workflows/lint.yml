name: lint
on: [push, pull_request]
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh uninstall.sh lib/*.sh
      - run: python3 -m unittest discover -s tests -v
      - run: sudo python3 -m unittest discover -s tests -p test_install.py -v
